name: Check portable workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s modules/daily-review/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_release.py . --git-index --git-history
      - run: python scripts/package.py
      - run: python tools/audit_release.py . --archives artifacts
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: powershell
        run: .\modules\desktop-board\tests\test-models.ps1
      - run: python -m unittest discover -s tests -v
